input_dir: ""
results_dir: ""
metagenome: True
# Optional RNA discovery feeding the existing filtered vOTU catalogue (all/runWorkflow).
RNA_enriched: False # add RNA assembly for every paired-end sample in input_dir
rna_assemblers: "rnaviralspades megahit trinity"
rna_min_contig_length: 500
rna_assembly_threads: 16
rna_assembly_mem_mb: 64000 # SPAdes/MEGAHIT allocation; Trinity adds its concurrent Butterfly heaps
rna_trinity_threads: 8 # concurrent partitions; separate from SPAdes/MEGAHIT
rna_trinity_bfly_heap_gb: 20 # Java heap per Butterfly process; leave RAM for concurrent jobs and overhead
rna_trinity_strandedness: "" # empty (unstranded), RF, or FR; check library preparation
# RNA-positive representatives have a separate acceptance route in the shared final filter.
rna_viral_groups: "RNA" # optionally dsDNAphage,NCLDV,RNA,ssDNA,lavidaviridae
circularity_min_repeat_bp: 30 # minimum exact terminal repeat reported as evidence
circularity_max_repeat_bp: 5000 # maximum sequence examined at each contig end
microdiversity: False # independent of RNA_enriched; map every sample to the final catalogue
map_to_RefSeq: False # independent full-cleaned-read branch; includes orphans in isolate mode
map_to_all_assembled: False # 2M cleaned-read subset in viromes; all paired and orphan reads in isolate mode
all_assembled_cluster_top_n: 1000 # top contigs by mean raw RPKM across non-NC samples; union with each sample's top contigs, not an overall cap
all_assembled_top_per_sample: 100 # add each non-NC sample's top non-zero contigs to the clustering selection
run_cenote: False # Cenote-Taker3 discovery/annotation of every selected cluster representative; requires map_to_all_assembled
cenote_min_contig_length: 0 # shorter selected contigs remain in the metadata, without a Cenote result
cenote_threads: 8
cenote_mem_mb: 16000 # scheduling reservation, not a tool-enforced memory limit
cenote_prune_prophage: False # optionally report viral regions after removing flanking cellular sequence
annotation_fastas: {} # optional dataset-to-FASTA paths, e.g. custom.tot: /path/to/contigs.fasta
negative_control: "" # optional sample ID in input_dir, e.g. NT202_MSV_NC_10
refseq_metadata_refresh: False # re-download cached NCBI accession metadata on the next report run
refseq_high_min_length_bp: 6667
refseq_high_min_covered_bases: 5000 # strictly greater for genomes >= refseq_high_min_length_bp
refseq_high_min_breadth_percent: 75 # strictly greater for shorter genomes
refseq_high_min_unique_reads: 5
refseq_candidate_min_unique_reads: 10
refseq_candidate_min_breadth_percent: 25
refseq_ambiguous_min_reads: 5
refseq_ambiguous_max_unique_ratio: 0.2
refseq_negative_control_min_reads: 5
refseq_negative_control_max_enrichment: 2
refseq_enrichment_pseudocount: 0.01
refseq_plot_max_accessions: 60
microdiversity_min_depth: 100
microdiversity_min_base_quality: 30
microdiversity_min_mapping_quality: 30
microdiversity_min_alt_frequency: 0.03
microdiversity_min_alt_count: 5
microdiversity_max_depth: 100000
microdiversity_threads: 8
microbial: False
sourmash: False
sourmash_contig_catalogue: False # Optional GTDB screen of the global phage-isolate cluster representatives
sourmash_contig_catalogue_min_length: 5000 # Inclusive cutoff; shorter clusters remain in the catalogue
sourmash_clean_reads: False # Optional per-sample and pooled final-clean-read profiles for phage_isolates
sourmash_clean_min_shared_bp: 50000
sourmash_clean_min_reference_fraction: 0.10 # K-mer containment, not measured read-mapping breadth


key_samples: "key_samples_list.csv"
# Optional final abundance report metadata; sample IDs must match the read libraries.
abundance_sample_metadata: "" # CSV with a sample column and optional grouping columns
abundance_group_column: "" # e.g. treatment; empty means no grouped comparisons
abundance_crispr_host_metadata: "" # CSV: microbial_contig, microbial_contig_length_bp, genus; optional higher ranks
abundance_common_prevalence: 0.2
abundance_core_prevalence: 0.5
operating_system: "linux"
forward_tag: "R1"
reverse_tag: "R2"
pacbio_tag: pacbio
nanopore_tag: "nanopore"
nanopore_pooled: False
nanopore_pooled_name: "raw"
long_assembler: "flye"
genomad_filter: "relaxed" # "default", "relaxed", or "conservative"

pacbio: False
long_assembler_pacbio: hifiasm
busco_lineage: fungi_odb10

genome_size: "20m"

# Illumina trimming with fastp (overlap analysis + PE adapter detection; no adapter FASTA)
fastp_cut_front_window_size: 1
fastp_cut_front_mean_quality: 20
fastp_cut_right_window_size: 4
fastp_cut_right_mean_quality: 20
fastp_length_required: 50
fastp_poly_g_min_len: 10
fastp_qualified_quality_phred: 15
fastp_unqualified_percent_limit: 40
fastp_n_base_limit: 5
pacbio_min_length: 1000
pacbio_min_quality: 20
nanopore_quality: 10
nanopore_minlen: 1000
nanopore_maxlen: 10000000
nanopore_headcrop: 50
nanopore_tailcrop: 50
medaka_model: "r941_min_high_g360" # r1041_e82_400bps_sup_g615
contaminants_taxid: 2759 # metazoa and plants "33208 33090"
remove_euk: True # set to False to calculate Kraken euk contamination without removing those reads

subsampling: False
subassembly: False
VirSorter: False
assembly_stats: False
cross_assembly: False
long_index: False
run_vcontact: False
run_DRAM: False
run_dnaapler: False
metavr_blast: False # MetaVR BLAST plus environment, viral-taxonomy and recorded-host report
ecc_memory: 6000
representative_contigs: ""
sra_list: ""
extract_mapped: False
isolates: False
# Isolate mode keeps all fastp-passed reads, including orphans; no biological removal or 2M mapping subset.
host_identification_test: False # optional full-read comparison against every masked/unmasked host
host_prophage_activity: True # isolate-only report using full reads against the assigned unmasked host
host_prophage_activity_min_ratio: 2.0
host_prophage_activity_min_cohen_d: 0.70
host_prophage_activity_min_mean_depth: 1.0
host_prophage_activity_min_breadth_percent: 50
host_prophage_activity_mask_bp: 150
host_prophage_activity_min_length_bp: 1000
host_prophage_activity_plot_flank_bp: 20000 # display only; statistics use the whole parent scaffold background
isolate_min_depth: 5
isolate_min_length_bp: 4000
isolate_short_min_depth: 10 # depth >=5 AND (length >=4000 OR depth >=10)
isolate_host_min_identity: 90
isolate_host_min_query_coverage: 90
isolate_min_retained_mapping_percent: 70
isolate_max_host_mapping_percent: 10
isolate_max_unexplained_percent: 10
isolate_mapping_threads: 8
isolate_mapping_mem_mb: 16000
isolate_host_test_min_reads: 100 # minimum evidence for the optional comparison, not an automatic host assignment
isolate_host_test_min_breadth_percent: 1
isolate_plot_max_clusters: 100 # figure limit only; complete tables are retained
isolate_plot_max_host_contigs: 100
#species
p_ident: "95"

#Count Unique
kmer_window: "25000"

#bbnorm
min_norm: "0"
max_norm: "100"
max_subsample: "50000000"

#Spades and canu assembly
min_len: "1000"
min_cov: "0"

# min_votu_length
min_votu_length: 5000
