[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic"
version = "0.1.0"
description = "MOSAIC modular Snakemake workflows for viral and microbial genomics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "MOSAIC developers" }
]
dependencies = [
  "click",
  "ruamel.yaml",
]

[project.scripts]
mosaic = "mosaic.mosaic:cli"

[tool.setuptools.packages.find]
include = ["mosaic*"]

[tool.setuptools.package-data]
mosaic = [
  "Snakefile",
  "config.yaml",
  "Mosaic.yaml",
  "rules/*.smk",
  "envs/*.yaml",
  "scripts/*",
  "notebooks/*.ipynb",
  "db/adapters/*.fa",
  "db/contaminants/*.fasta",
  "db/hmm/*.hmm",
  "db/PATRIC/*.txt",
  "db/vcontact2/*.csv",
  "db/vcontact2/*.tsv",
  "db/caudovirales_orf_lengths_09_05_2023.txt",
]
